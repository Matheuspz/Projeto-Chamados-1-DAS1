<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Atende</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 12vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Atende</h1>
            <p class="text-muted mb-4">Entre com seu e-mail e senha.</p>

            <div th:if="${param.erro}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>E-mail ou senha inválidos.
            </div>
            <div th:if="${param.saiu}" class="alert alert-success" role="alert">
                <i class="bi bi-check-circle me-2"></i>Você saiu da sessão.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">E-mail</label>
                    <input class="form-control" id="username" name="username" type="email"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Senha</label>
                    <input class="form-control" id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
