<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{portal/base :: head('Chamado')}"></head>
<body class="bg-light">
<header th:replace="~{portal/base :: topo}"></header>
<div class="container" style="max-width: 900px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3" th:text="${editando} ? 'Editar chamado' : 'Abrir chamado'">Abrir chamado</h1>
            <form th:object="${form}" method="post"
                  th:action="${editando} ? @{/meu/chamados/{id}/editar(id=${registroId})} : @{/meu/chamados}">
                <div class="mb-3">
                    <label class="form-label" for="titulo">Título</label>
                    <input class="form-control" id="titulo" type="text" maxlength="100" th:field="*{titulo}"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{titulo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="descricao">Descrição</label>
                    <textarea class="form-control" id="descricao" rows="5" maxlength="1000" th:field="*{descricao}"
                              th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{descricao}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="categoriaId">Categoria</label>
                        <select class="form-select" id="categoriaId" th:field="*{categoriaId}"
                                th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'">
                            <option value="">Selecione</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.titulo}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="prioridade">Prioridade</label>
                        <select class="form-select" id="prioridade" th:field="*{prioridade}"
                                th:classappend="${#fields.hasErrors('prioridade')} ? 'is-invalid'">
                            <option th:each="p : ${prioridadeOptions}" th:value="${p}" th:text="${p}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{prioridade}"></div>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/meu/chamados}">Cancelar</a>
                    <button class="btn btn-primary" type="submit" th:text="${editando} ? 'Salvar' : 'Abrir chamado'">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
