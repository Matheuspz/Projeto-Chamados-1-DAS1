<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{portal/base :: head('Chamado')}"></head>
<body class="bg-light">
<header th:replace="~{portal/base :: topo}"></header>
<div class="container" style="max-width: 900px;">
    <div class="card shadow-sm mb-3">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start">
                <h1 class="h4" th:text="'#' + ${chamado.id} + ' · ' + ${chamado.titulo}">#1 · Título</h1>
                <span class="badge text-bg-secondary" th:text="${#strings.replace(chamado.status.name(), '_', ' ')}">ABERTO</span>
            </div>
            <p class="text-muted small mb-3">
                <span th:text="${chamado.categoriaNome}">Categoria</span> ·
                Prioridade <span th:text="${chamado.prioridade}">MEDIA</span> ·
                Aberto em <span th:text="${criadoEm}">—</span> ·
                Técnico: <span th:text="${chamado.tecnicoNome != null} ? ${chamado.tecnicoNome} : 'ainda não atribuído'">—</span>
            </p>
            <p style="white-space: pre-line;" th:text="${chamado.descricao}">Descrição</p>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/meu/chamados}">Voltar</a>
                <a class="btn btn-primary" th:if="${podeEditar}" th:href="@{/meu/chamados/{id}/editar(id=${chamado.id})}">Editar</a>
            </div>
        </div>
    </div>
    <div class="card shadow-sm" th:if="${!chamado.comentarios.empty}">
        <div class="card-body">
            <h2 class="h6">Comentários</h2>
            <div class="border-top pt-2 mt-2" th:each="co : ${chamado.comentarios}">
                <strong th:text="${co.autor}">Autor</strong>
                <div th:text="${co.texto}">Texto</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
