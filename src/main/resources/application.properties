spring.application.name=chamados

spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.data.web.pageable.max-page-size=50

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# usuários de DEMONSTRAÇÃO (admin@, tecnico@, cliente1@, cliente2@ chamados.local)
app.seed.enabled=true
app.seed.senha=Senha@123
