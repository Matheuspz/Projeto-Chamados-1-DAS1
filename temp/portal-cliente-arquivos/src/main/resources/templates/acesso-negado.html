<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso negado | Atende</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="container" style="max-width: 460px; margin-top: 12vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
            <h1 class="h4 mb-2"><i class="bi bi-shield-lock me-2"></i>Acesso negado</h1>
            <p class="text-muted">Sua conta não tem permissão para acessar esta página.</p>

            <div class="d-grid gap-2">
                <button class="btn btn-primary" type="button"
                        onclick="if (history.length > 1) { history.back(); } else { window.location.href = '/inicio'; }">
                    <i class="bi bi-arrow-left me-1"></i>Voltar à página anterior
                </button>
                <a class="btn btn-outline-secondary" th:href="@{/inicio}">Ir para o início</a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-link text-muted" type="submit">Sair e entrar com outra conta</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
