<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Atende'">Atende</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<header th:fragment="topo">
    <nav class="navbar navbar-expand bg-dark navbar-dark mb-4">
        <div class="container" style="max-width: 900px;">
            <a class="navbar-brand" th:href="@{/meu/chamados}"><i class="bi bi-headset me-2"></i>Atende</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" th:href="@{/meu/chamados}">Meus chamados</a>
                <a class="nav-link" th:href="@{/meu/chamados/novo}">Novo chamado</a>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </form>
        </div>
    </nav>
    <div class="container" style="max-width: 900px;">
        <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    </div>
</header>
</body>
</html>
